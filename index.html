<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zion Sathvartha</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--bd:#e3e8f1;--pr:#3b4bd8;--pr2:#eef0ff;--ok:#12a36b;--wa:#e99a00;--er:#d83b4b}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#8e99b3;--bd:#263048;--pr:#7c8bff;--pr2:#1f2745}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#8e99b3;--bd:#263048;--pr:#7c8bff;--pr2:#1f2745}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#2a35b8,#5b3fd0);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:19px;letter-spacing:.2px}header p{margin:2px 0 0;opacity:.8;font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:600 13px inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.btn{border:0;background:var(--pr);color:#fff;padding:9px 14px;border-radius:8px;font:600 13px inherit;cursor:pointer}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.s{padding:4px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;margin-top:2px}.kpi span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border:0}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--pr2);color:var(--pr)}
.Positive,.ok{background:#12a36b22;color:var(--ok)}.Negative,.Overdue,.Pending{background:#d83b4b22;color:var(--er)}.Due,.Busy,.Neutral{background:#e99a0022;color:var(--wa)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}.bar i{display:block;height:8px;border-radius:4px;background:var(--pr)}.bar em{width:130px;font-style:normal;color:var(--mu)}
dialog{border:0;border-radius:14px;padding:18px;width:min(460px,94vw);background:var(--card);color:var(--tx)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.chip{margin:0;font-size:14px;color:var(--tx)}.chip input{display:none}.chip span{display:block;text-align:center;padding:9px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}.chip input:checked+span{background:var(--pr);color:#fff;border-color:var(--pr)}
dialog{max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 3px}dialog input,dialog select,dialog textarea{width:100%}
.empty{text-align:center;color:var(--mu);padding:30px}
.trend{display:flex;gap:4px;align-items:flex-end;height:120px}.trend>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}.trend i{display:block;width:100%;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}
h2{font-size:15px;margin:0 0 8px}
</style></head><body>
<header><h1>✝ Zion Sathvartha</h1><p>Outreach Ministry System · Fresh Contact → Follow Up → Content Share → Sathvartha</p></header>
<nav id="nav"></nav><main id="app"></main>
<dialog id="dlg"><form method="dialog" onsubmit="return false"><h2 id="dt"></h2><div id="df"></div>
<div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" onclick="save()">Save</button></div></form></dialog>
<datalist id="ids"></datalist>
<input type="file" id="imp" accept=".csv,.txt,text/csv,text/plain" hidden onchange="onImp(this)">
<script src="app.js?v=1"></script></body></html>
